[package]
name = "upland"
version = "0.1.0"
edition = "2024"
description = "Upland web application"
license-file = "LICENSE"
repository = "https://github.com/xminihub/upland"

[[bin]]
name = "upland"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
axum-test = "21.1.0"
