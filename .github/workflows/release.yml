name: Release

# One line, seven jobs: verify → release → build → package → github-release →
# tap → cargo. The sequence is the doctrine: every gate runs before the bump,
# so a red release leaves no version to explain (ADR-0001), and the tail is
# the channel order — binary, then tap, then crate — so the one-shot registry
# version burns only after every higher channel is green (ADR-0006). Each job
# runs a script; the YAML is wiring: checkouts, toolchains, artifact transfer.
# The rationale lives beside the logic it explains, in scripts/.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Least privilege as the floor; only the two jobs that write to the repository
# say so on purpose.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.table.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # The table is the matrix (ADR-0001): validated first, before any
      # toolchain is installed, so a broken row costs seconds. The emitted
      # JSON feeds the build matrix below — there is no reader job anymore.
      - name: Check the target table
        id: table
        run: echo "matrix=$(bash scripts/check-targets.sh)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run format:check
          bun run test
          bun run build

      # Every target embeds this output, so one build feeds them all and the
      # release cannot ship a binary whose SPA differs from the tested one.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

      - name: Rust
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets
          cargo test --locked --all-targets

      - name: Assert the crate packaging
        run: bash scripts/assert-crate-packaging.sh

  release:
    name: Bump & Tag
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-edit --version 0.13.13 --locked

      # The one job that moves main and cuts tags. Everything that must be
      # green before a version may exist has run by now; see the script.
      - name: Bump, tag, push
        id: bump
        run: |
          version="$(bash scripts/bump-and-tag.sh --bump "${{ inputs.bump }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: [verify, release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # A broken target stops the fleet: a red release should stop early,
      # not harvest a full set of partial artifacts.
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.rustTarget }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rustTarget }}

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # The x86_64 slice is cross-compiled on an arm64 runner, and it is also
      # run there: the smoke inside build-target.sh proves the artifact
      # starts, which needs Rosetta. A runner that cannot install it fails
      # here instead of shipping an unrun Intel binary.
      - name: Install Rosetta (x86_64 macOS builds)
        if: matrix.rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      # Bundled SQLite is C, and the static musl link needs a musl C compiler
      # the Ubuntu runners do not ship (ADR-0001).
      - name: Install the musl toolchain
        if: endsWith(matrix.rustTarget, '-musl')
        run: bash scripts/install-musl-toolchain.sh

      # Build and smoke as one contract, straight off the table row: the
      # binary must run and must name this release before anything packages
      # it (ADR-0001).
      - name: Build & smoke
        shell: bash
        run: bash scripts/build-target.sh --target "${{ matrix.name }}" --version "${{ needs.release.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: target/${{ matrix.rustTarget }}/release/upland${{ matrix.exe && '.exe' || '' }}
          retention-days: 7

  package:
    name: Package release assets
    needs: [release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      # merge-multiple stays off: every target's binary is named `upland`, so
      # merging them into one directory would leave only one of them.
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/binaries
          merge-multiple: false

      - name: Pack the release assets
        run: bash scripts/pack-assets.sh --version "${{ needs.release.outputs.version }}"

      - name: Assert the asset set
        run: bash scripts/assert-assets.sh

      # The notes file and the manifest ride along with the assets so the
      # publishing job has the body it publishes and the run keeps a record;
      # only dist/assets is ever uploaded to the release itself.
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/assets
            dist/notes.md
            dist/manifest.jsonl
          retention-days: 30

  github-release:
    name: GitHub Release
    needs: [release, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      # No checkout: gh needs to know which repository it is talking to, and in
      # Actions GH_REPO says so without pulling the tree down for one command.
      # The generated notes still come; the structured body states the asset
      # set the manifest derived, which no autogenerated list can.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "v${{ needs.release.outputs.version }}" dist/assets/* \
            --title "v${{ needs.release.outputs.version }}" \
            --notes-file dist/notes.md \
            --generate-notes

  tap:
    name: Bump org Homebrew tap
    needs: [release, github-release]
    runs-on: ubuntu-latest
    # The timeout is what finally bounds the bump-run watch; see the script
    # for why the formula read-back, not the run's conclusion, is the verdict.
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TAP_TRIGGER_TOKEN }}
    steps:
      - name: Bump the tap and pin the formula
        run: bash scripts/bump-tap.sh --repo xminihub/homebrew-tap --tool upland --version "${{ needs.release.outputs.version }}"

  cargo:
    name: Publish crate
    needs: [release, tap]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # One build feeds every channel (ADR-0001), and the cargo channel is
      # no exception: the same web-dist artifact the darwin, Linux and
      # Windows binaries embed is staged here before packaging.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # Asserted again before publishing because republishing assets is legal
      # and republishing a registry version is not (ADR-0006).
      - name: Assert the crate packaging
        run: bash scripts/assert-crate-packaging.sh

      # The publish itself is the script CI's packaging job dry-runs, and an
      # already-published version skips rather than fails (ADR-0006).
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh "${{ needs.release.outputs.version }}"
