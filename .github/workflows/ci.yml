name: CI

# Two lanes, one merge, one gate: Web and Rust run in parallel and never talk
# to each other; Packaging merges them — asserting the repo's shell contracts,
# and the crate's file listing against the SPA bundle the Web lane built; Gate
# is the run's single green statement, coloured by the lane results handed to
# its summary script.

on:
  pull_request:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # One lane, one job, steps in sequence: fmt and clippy fail the lane
      # before the test build is paid for, and a single checkout and cache
      # restore serve every step. No SPA bundle is staged: the
      # embedded-SPA-serving tests print their SKIPPING notice in CI, by
      # decision — Packaging proves below that the bundle is what ships.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked --all-targets

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    needs: [ web, rust ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The merge consumes the Web lane's SPA bundle: it can only assert what
      # the packer will really carry over a staged web/dist, and staging it
      # here is what earns this job its position after both lanes.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # GNU tar is what the org tap's contract is written with, and this
      # repository's tarballs are packed by it on Linux, so the assertions run
      # here rather than in cargo test, where a developer's tar is bsdtar.
      - name: Assert the brew tarball contract
        run: bash scripts/test-package-brew-tarball.sh

      - name: Assert the gate summary contract
        run: bash scripts/test-ci-gate-summary.sh

      # The crate must ship what every other channel ships: the staged SPA
      # bundle, the migrations, and the offline query metadata. Before this
      # ran only mid-release, after the bump; a packaging mistake now costs a
      # red CI run, not a version to explain (ADR-0006).
      - name: Assert the crate packaging
        run: bash scripts/assert-crate-packaging.sh

      # The listing above is what the packager would carry; this is whether it
      # accepts the tree at all. cargo's clean-tree check counts every packaged
      # file git has not committed, so the staged bundle has to be committed
      # for the publish to see a clean tree — the same thing the release job
      # does, which is why this is that job's script, run as a dry run: no
      # upload, no token, no registry version burned. Without it the failure
      # only ever surfaced on release day, after the tag and the assets.
      - name: Assert the crate publishes
        run: bash scripts/publish-crate.sh --dry-run

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [ web, rust, packaging ]
    # always(): a red lane skips this job without it, and a skipped Gate is
    # silent — with it, the Gate stays the one place the run reports itself.
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Summarise the run, colour the gate
        run: |
          bash scripts/ci-gate-summary.sh \
            "Web=${{ needs.web.result }}" \
            "Rust=${{ needs.rust.result }}" \
            "Packaging=${{ needs.packaging.result }}"
